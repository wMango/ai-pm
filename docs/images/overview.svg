<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif">
  <title>ai-pm 总览：三个输入，一个引擎，五个视图</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#18222f"/></marker>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#18222f" stroke-opacity=".06"/></pattern>
  </defs>
  <rect width="960" height="380" rx="20" fill="#f4f1ea"/>
  <rect width="960" height="380" rx="20" fill="url(#grid)"/>

  <text x="40" y="48" font-size="22" font-weight="900" fill="#18222f">做了 ≠ 生效：用图管理被 AI 放大的项目</text>
  <text x="40" y="74" font-size="13" fill="#4a5666">状态只看验收测试；模块自身完成、且上游全部生效，才算真正可用</text>

  <!-- 输入 -->
  <g font-size="13">
    <g transform="translate(40,110)"><rect width="150" height="54" rx="10" fill="#fffdf8" stroke="#18222f" stroke-width="2"/><text x="75" y="24" text-anchor="middle" font-weight="900" fill="#18222f">pm.yaml</text><text x="75" y="42" text-anchor="middle" font-size="11" fill="#8a94a1">目标 · 三套架构 · 旅程</text></g>
    <g transform="translate(40,182)"><rect width="150" height="54" rx="10" fill="#fffdf8" stroke="#18222f" stroke-width="2"/><text x="75" y="24" text-anchor="middle" font-weight="900" fill="#18222f">验收测试结果</text><text x="75" y="42" text-anchor="middle" font-size="11" fill="#8a94a1">evidence.json</text></g>
    <g transform="translate(40,254)"><rect width="150" height="54" rx="10" fill="#fffdf8" stroke="#18222f" stroke-width="2"/><text x="75" y="24" text-anchor="middle" font-weight="900" fill="#18222f">token 流水</text><text x="75" y="42" text-anchor="middle" font-size="11" fill="#8a94a1">ledger.jsonl</text></g>
  </g>
  <g fill="none" stroke="#18222f" stroke-width="2">
    <path d="M190,137 C230,137 230,209 262,209" marker-end="url(#a)"/>
    <path d="M190,209 L262,209" marker-end="url(#a)"/>
    <path d="M190,281 C230,281 230,209 262,209" marker-end="url(#a)"/>
  </g>

  <!-- 引擎 -->
  <g transform="translate(270,160)">
    <rect width="190" height="98" rx="14" fill="#18222f"/>
    <text x="95" y="34" text-anchor="middle" font-size="16" font-weight="900" fill="#fffdf8">计算引擎</text>
    <text x="95" y="58" text-anchor="middle" font-size="11" fill="#fffdf8" opacity=".8">生效 · 根因 · 目标缺口</text>
    <text x="95" y="76" text-anchor="middle" font-size="11" fill="#fffdf8" opacity=".8">杠杆推荐 · 成本 · 蓝图</text>
  </g>
  <path d="M460,209 L512,209" fill="none" stroke="#18222f" stroke-width="2" marker-end="url(#a)"/>

  <!-- 双环 -->
  <g transform="translate(520,104)">
    <rect width="400" height="232" rx="16" fill="#fffdf8" stroke="#18222f" stroke-opacity=".14"/>
    <text x="20" y="32" font-size="14" font-weight="900" fill="#18222f">示例项目：智能知识库问答平台</text>
    <g transform="translate(40,46)">
      <circle cx="56" cy="56" r="46" fill="none" stroke="#ebe6db" stroke-width="12"/>
      <circle cx="56" cy="56" r="46" fill="none" stroke="#18222f" stroke-width="12" stroke-linecap="round" stroke-dasharray="150.3 289" transform="rotate(-90 56 56)"/>
      <text x="56" y="63" text-anchor="middle" font-size="20" font-weight="900" fill="#18222f">52%</text>
      <text x="56" y="136" text-anchor="middle" font-size="13" font-weight="900" fill="#18222f">建成度</text>
      <text x="56" y="154" text-anchor="middle" font-size="11" fill="#4a5666">12/23 验收通过</text>
    </g>
    <g transform="translate(220,46)">
      <circle cx="56" cy="56" r="46" fill="none" stroke="#ebe6db" stroke-width="12"/>
      <circle cx="56" cy="56" r="46" fill="none" stroke="#17936b" stroke-width="12" stroke-linecap="round" stroke-dasharray="112.7 289" transform="rotate(-90 56 56)"/>
      <text x="56" y="63" text-anchor="middle" font-size="20" font-weight="900" fill="#18222f">39%</text>
      <text x="56" y="136" text-anchor="middle" font-size="13" font-weight="900" fill="#17936b">生效度</text>
      <text x="56" y="154" text-anchor="middle" font-size="11" fill="#4a5666">9/23 真正可用</text>
    </g>
    <text x="200" y="220" text-anchor="middle" font-size="12" font-weight="700" fill="#d4443b">差值 = 写好了、却被上游卡住的模块</text>
  </g>
</svg>
