<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" width="960" height="250" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif">
  <title>项目地图的五个视图</title>
  <rect width="960" height="250" rx="20" fill="#f4f1ea"/>

  <!-- ① 架构地图 -->
  <g transform="translate(20,20)">
    <rect width="168" height="210" rx="14" fill="#fffdf8" stroke="#18222f" stroke-opacity=".14"/>
    <rect x="16" y="22" width="40" height="18" rx="4" fill="#dff3ea" stroke="#17936b" stroke-width="2"/>
    <rect x="64" y="22" width="40" height="18" rx="4" fill="#fcecd5" stroke="#d9821a" stroke-width="2"/>
    <rect x="112" y="22" width="40" height="18" rx="4" fill="#e1e9fb" stroke="#3866d6" stroke-width="2" stroke-dasharray="4 3"/>
    <rect x="40" y="70" width="40" height="18" rx="4" fill="#fcecd5" stroke="#d9821a" stroke-width="2"/>
    <rect x="96" y="70" width="40" height="18" rx="4" fill="#eef0f2" stroke="#97a0ab" stroke-width="2" stroke-dasharray="4 3"/>
    <rect x="96" y="118" width="40" height="18" rx="4" fill="#eef0f2" stroke="#97a0ab" stroke-width="2" stroke-dasharray="4 3"/>
    <path d="M84,40 L62,68 M136,79 L136,79 M116,88 L116,116" stroke="#d4443b" stroke-width="2" stroke-dasharray="4 3" fill="none"/>
    <path d="M80,79 L94,79" stroke="#d4443b" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="84" y="170" text-anchor="middle" font-size="15" font-weight="900" fill="#18222f">① 架构地图</text>
    <text x="84" y="192" text-anchor="middle" font-size="11" fill="#4a5666">功能 / 逻辑 / 物理三张图</text>
  </g>

  <!-- ② 依赖与阻塞 -->
  <g transform="translate(206,20)">
    <rect width="168" height="210" rx="14" fill="#fffdf8" stroke="#18222f" stroke-opacity=".14"/>
    <rect x="20" y="30" width="128" height="16" rx="4" fill="#d4443b"/>
    <rect x="20" y="60" width="84" height="16" rx="4" fill="#d9821a"/>
    <rect x="20" y="90" width="40" height="16" rx="4" fill="#d9821a"/>
    <text x="20" y="134" font-size="11" fill="#4a5666">根因链卡住了几个</text>
    <text x="20" y="150" font-size="11" fill="#4a5666">已写好的模块</text>
    <text x="84" y="170" text-anchor="middle" font-size="15" font-weight="900" fill="#18222f">② 依赖与阻塞</text>
    <text x="84" y="192" text-anchor="middle" font-size="11" fill="#4a5666">先修哪条根因</text>
  </g>

  <!-- ③ 目标与下一步 -->
  <g transform="translate(392,20)">
    <rect width="168" height="210" rx="14" fill="#fffdf8" stroke="#18222f" stroke-opacity=".14"/>
    <circle cx="52" cy="62" r="28" fill="none" stroke="#ebe6db" stroke-width="8"/>
    <circle cx="52" cy="62" r="28" fill="none" stroke="#d9821a" stroke-width="8" stroke-dasharray="83 176" transform="rotate(-90 52 62)"/>
    <text x="52" y="67" text-anchor="middle" font-size="13" font-weight="900" fill="#18222f">47%</text>
    <path d="M96,72 L148,40" stroke="#17936b" stroke-width="3" fill="none"/>
    <circle cx="148" cy="40" r="5" fill="#17936b"/>
    <text x="122" y="88" text-anchor="middle" font-size="11" font-weight="700" fill="#17936b">→ 79%</text>
    <text x="84" y="128" text-anchor="middle" font-size="11" fill="#4a5666">做完这件事，目标</text>
    <text x="84" y="144" text-anchor="middle" font-size="11" fill="#4a5666">会怎样变化</text>
    <text x="84" y="170" text-anchor="middle" font-size="15" font-weight="900" fill="#18222f">③ 目标与下一步</text>
    <text x="84" y="192" text-anchor="middle" font-size="11" fill="#4a5666">按杠杆排序的推荐</text>
  </g>

  <!-- ④ 成本 -->
  <g transform="translate(578,20)">
    <rect width="168" height="210" rx="14" fill="#fffdf8" stroke="#18222f" stroke-opacity=".14"/>
    <rect x="104" y="20" width="48" height="112" fill="#d4443b" opacity=".07"/>
    <line x1="104" x2="104" y1="20" y2="132" stroke="#d4443b" stroke-dasharray="4 3"/>
    <circle cx="40" cy="110" r="9" fill="#dff3ea" stroke="#17936b" stroke-width="2"/>
    <circle cx="92" cy="64" r="16" fill="#fcecd5" stroke="#d9821a" stroke-width="2"/>
    <circle cx="128" cy="48" r="18" fill="#e1e9fb" stroke="#3866d6" stroke-width="2" stroke-dasharray="4 3"/>
    <circle cx="128" cy="48" r="24" fill="none" stroke="#d4443b" stroke-width="1.5" stroke-dasharray="4 3"/>
    <line x1="20" x2="152" y1="132" y2="132" stroke="#8a94a1"/>
    <text x="84" y="170" text-anchor="middle" font-size="15" font-weight="900" fill="#18222f">④ 成本</text>
    <text x="84" y="192" text-anchor="middle" font-size="11" fill="#4a5666">时间 × token · 卡住预警</text>
  </g>

  <!-- ⑤ 旅程蓝图 -->
  <g transform="translate(764,20)">
    <rect width="176" height="210" rx="14" fill="#fffdf8" stroke="#18222f" stroke-opacity=".14"/>
    <path d="M24,30 L64,30 L104,52 L144,52" stroke="#8a94a1" stroke-width="2" fill="none"/>
    <circle cx="24" cy="30" r="5" fill="#17936b"/><circle cx="64" cy="30" r="5" fill="#17936b"/><circle cx="104" cy="52" r="5" fill="#d4443b"/><circle cx="144" cy="52" r="5" fill="#d4443b"/>
    <line x1="14" x2="160" y1="80" y2="80" stroke="#8a94a1" stroke-dasharray="4 3"/>
    <line x1="14" x2="160" y1="104" y2="104" stroke="#18222f" stroke-width="2" stroke-dasharray="8 4"/>
    <line x1="14" x2="160" y1="128" y2="128" stroke="#8a94a1" stroke-dasharray="4 3"/>
    <line x1="104" x2="104" y1="140" y2="64" stroke="#d4443b" stroke-width="3"/>
    <text x="88" y="170" text-anchor="middle" font-size="15" font-weight="900" fill="#18222f">⑤ 旅程蓝图</text>
    <text x="88" y="192" text-anchor="middle" font-size="11" fill="#4a5666">用户走到哪一步会断</text>
  </g>
</svg>
