name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: 测试（Node ${{ matrix.node }}）
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: 类型检查
        run: npm run typecheck
      - name: 测试（会先重新构建 plugin/bin/pm.mjs）
        run: npm test
      - name: 提交的 pm.mjs 与源码一致
        run: git diff --exit-code -- plugin/bin

  validate:
    name: 插件与市场清单校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - name: 校验插件
        run: claude plugin validate ./plugin --strict
      - name: 校验市场
        run: claude plugin validate . --strict
